name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: vps-value-ci
      VPS_VALUE_IMAGE: vps-value:ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Existing tests, build and dependency audit (Docker only)
        run: docker build --target verify --tag vps-value:verify .
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and check container health
        run: docker compose up -d --build --wait --wait-timeout 90
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove CI containers and temporary data
        if: always()
        run: docker compose down --volumes
